<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>~/90-day-interview-prep — main</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0D16; --bg-side: #0D101C; --bg-elevated: #0F1424; --bg-card: #10162A; --bg-hover: #161D33;
    --border: #1E2740; --border-soft: #171E36;
    --text: #C7D0EE; --text-bright: #EDF1FF; --text-dim: #6B7694; --text-faint: #454F6E;
    --comment: #838FB8;
    --blue: #4C8DFF; --blue-soft: #1B2A4D;
    --purple: #A78BFA; --orange: #F0A153; --green: #3FB950; --green-soft: #12321C;
    --red: #FF5F56; --yellow: #FFBD2E;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 90px; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text);
    font-family: "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
    font-size: 13.5px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(circle at 15% 8%, rgba(76,141,255,.10), transparent 40%),
      radial-gradient(circle at 85% 12%, rgba(167,139,250,.09), transparent 42%),
      radial-gradient(circle at 50% 95%, rgba(63,185,80,.07), transparent 45%),
      linear-gradient(160deg, #060810 0%, #0A0E1C 55%, #070911 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 26px; overflow: hidden;
  }
  .window {
    width: 100%; max-width: 1560px; height: calc(100vh - 52px); height: calc(100dvh - 52px);
    background: var(--bg); border-radius: 14px; overflow: hidden;
    box-shadow: 0 50px 100px -30px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.05), inset 0 1px 0 rgba(255,255,255,.03);
    display: flex; flex-direction: column;
  }
  @media (max-width: 720px) {
    body { padding: 0; }
    .window { max-width: none; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
  }
  ::selection { background: #274674; color: #fff; }
  button { font-family: inherit; }

  /* Title bar */
  .titlebar {
    display: flex; align-items: center; padding: 10px 16px; background: var(--bg-elevated);
    border-bottom: 1px solid var(--border); flex: none;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
  }
  .dots { display: flex; gap: 7px; width: 90px; flex: none; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: var(--red); } .dot.y { background: var(--yellow); } .dot.g { background: #27C93F; }
  .titlebar-title { flex: 1; text-align: center; color: var(--comment); font-size: 12.5px; }

  .shell { display: flex; flex: 1; min-height: 0; }

  /* Sidebar */
  .sidebar { width: 300px; flex: none; background: var(--bg-side); border-right: 1px solid var(--border); overflow-y: auto; padding: 14px 0 40px; }
  .sidebar-title { color: var(--text-faint); font-size: 11px; letter-spacing: .1em; padding: 4px 18px 10px; }
  .node { user-select: none; }
  .node-row {
    display: flex; align-items: center; gap: 7px; padding: 6px 14px; cursor: pointer; border-left: 2px solid transparent;
    font-size: 13px; white-space: nowrap; overflow: hidden;
  }
  .node-row:hover { background: var(--bg-hover); }
  .node-row.active { background: var(--bg-hover); border-left-color: var(--blue); }
  .node-row.pinned { font-weight: 700; color: var(--text-bright); }
  .caret { width: 12px; flex: none; color: var(--text-faint); font-size: 9px; transition: transform .15s; text-align: center; }
  .caret.open { transform: rotate(90deg); }
  .caret.leaf { visibility: hidden; }
  .node-label { overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .node-label .dim { color: var(--comment); font-style: italic; }
  .node-pct { margin-left: auto; flex: none; color: var(--text-faint); font-size: 11px; padding-left: 8px; }
  .node-icon { width: 15px; flex: none; text-align: center; font-size: 12px; }
  .icon-check { color: var(--green); } .icon-ring { color: var(--text-faint); }
  .indent-1 { padding-left: 30px; } .indent-2 { padding-left: 46px; } .indent-3 { padding-left: 62px; }
  .children { display: none; } .children.open { display: block; }
  .sidebar-sep { height: 1px; background: var(--border-soft); margin: 10px 14px; }

  /* Main */
  .mainpane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .tabbar { display: flex; background: var(--bg-elevated); border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 12.5px; color: var(--text-dim); border-right: 1px solid var(--border); cursor: pointer; white-space: nowrap; }
  .tab.active { color: var(--text-bright); background: var(--bg); border-top: 2px solid var(--blue); padding-top: 8px; }
  .tab .x { color: var(--text-faint); margin-left: 4px; }
  .tab .x:hover { color: var(--text); }
  .breadcrumb { padding: 9px 22px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border-soft); }
  .breadcrumb .cur { color: var(--text); }
  .content { flex: 1; overflow-y: auto; padding: 34px 40px 80px; }
  @media (max-width: 900px) { .sidebar { position: fixed; left: 0; top: 41px; bottom: 0; z-index: 30; transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: translateX(0); } .content { padding: 24px 18px 80px; } }
  .menu-btn { display: none; background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 5px; padding: 4px 9px; font-size: 12px; margin-right: 10px; }
  @media (max-width: 900px) { .menu-btn { display: inline-block; } }

  /* Doc comment header */
  .doccomment { color: var(--comment); font-style: italic; margin: 0 0 26px; font-size: 13.5px; line-height: 1.8; }
  .doccomment .kw { color: var(--purple); font-weight: 700; font-style: normal; }
  .doccomment strong { color: var(--text-bright); font-style: normal; }

  /* Continue card */
  .continue-card {
    display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid var(--green);
    border-radius: 8px; padding: 18px 22px; margin-bottom: 24px;
  }
  .continue-card .label { color: var(--text-dim); font-size: 12px; margin-bottom: 4px; }
  .continue-card .title { color: var(--text-bright); font-size: 16px; font-weight: 700; }
  .btn-open {
    background: var(--blue); color: #fff; border: none; border-radius: 6px; padding: 10px 18px;
    font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .btn-open:hover { background: #5C99FF; }

  /* Stat cards */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 30px; }
  @media (max-width: 800px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; }
  .stat-num { font-size: 26px; font-weight: 800; color: var(--text-bright); }
  .stat-num .small { font-size: 14px; color: var(--text-dim); font-weight: 600; }
  .stat-label { color: var(--text-dim); font-size: 12px; margin-top: 4px; }

  h3.section-h { color: var(--text-bright); font-size: 14px; margin: 30px 0 12px; }
  h3.section-h .sl { color: var(--comment); font-style: italic; }

  /* commit graph */
  .grid90 { display: grid; grid-template-columns: repeat(30, 1fr); gap: 4px; max-width: 640px; }
  .sq { width: 100%; aspect-ratio: 1; border-radius: 3px; background: var(--bg-card); border: 1px solid var(--border); cursor: pointer; }
  .sq[data-lvl="1"] { background: #12321C; border-color: #1B4326; }
  .sq[data-lvl="2"] { background: #1D6B33; border-color: #237A3B; }
  .sq[data-lvl="3"] { background: var(--green); border-color: var(--green); }
  .grid-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--text-faint); font-size: 11.5px; }
  .legend-sq { width: 11px; height: 11px; border-radius: 2px; display: inline-block; border: 1px solid var(--border); }

  /* tracks */
  .track-row { display: flex; align-items: center; gap: 14px; padding: 9px 0; }
  .track-name { width: 230px; flex: none; font-size: 12.5px; color: var(--text); }
  .track-bar { flex: 1; height: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
  .track-fill { height: 100%; border-radius: 5px; }
  .track-count { width: 70px; flex: none; text-align: right; color: var(--text-dim); font-size: 12px; }

  .quote-banner {
    color: var(--comment); font-style: italic; font-size: 12.5px; margin: 0 0 22px;
    padding: 10px 14px; background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: 6px;
  }
  .quote-banner span { color: var(--text); font-style: normal; }
  .continue-mindset { margin-top: 8px; font-size: 12px; color: var(--comment); font-style: italic; max-width: 52ch; }

  .datectl { float: right; color: var(--text-dim); font-size: 11px; font-weight: 400; display: inline-flex; align-items: center; gap: 6px; }
  .datectl input[type="date"] {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text); border-radius: 4px;
    font-family: inherit; font-size: 11px; padding: 3px 6px; color-scheme: dark;
  }
  .sq.today { box-shadow: 0 0 0 2px var(--blue); }

  .consist-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12.5px; }
  .consist-table th { text-align: left; color: var(--text-faint); font-weight: 600; font-size: 11px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .consist-table td { padding: 9px 10px; border-bottom: 1px solid var(--border-soft); color: var(--text); }
  .consist-table tr:hover td { background: var(--bg-hover); }
  .consist-table tr.current-week td { background: var(--blue-soft); }
  .st-pending { color: var(--text-faint); }
  .st-done { color: var(--green); }
  .st-progress { color: var(--orange); }

  /* day view */
  .day-comment { color: var(--comment); font-style: italic; font-size: 13px; margin: 4px 0 16px; padding-left: 12px; border-left: 2px solid var(--border); }
  .mindset-box {
    background: var(--blue-soft); border: 1px solid #2A4A85; border-left: 3px solid var(--blue);
    border-radius: 8px; padding: 13px 16px; margin: 0 0 24px; font-size: 13px; color: var(--text-bright);
  }
  .mindset-label { color: var(--blue); font-weight: 700; }
  .task-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--border-soft); }
  .task-row:first-child { border-top: none; }
  .task-check { display: none; }
  .task-badge {
    width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--text-faint); flex: none; margin-top: 2px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; cursor: pointer;
  }
  .task-check:checked + .task-label .task-badge { background: var(--green); border-color: var(--green); color: #08130A; }
  .task-check:checked + .task-label .task-badge::after { content: "✓"; }
  .task-check:checked + .task-label .task-text { color: var(--text-dim); text-decoration: line-through; }
  .task-label { display: flex; gap: 10px; cursor: pointer; }
  .task-text .kw { color: var(--purple); } .task-text .str { color: var(--orange); }
  .daynav { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--border-soft); }
  .daynav a { color: var(--blue); font-size: 12.5px; cursor: pointer; }
  .daynav a:hover { text-decoration: underline; }
  .daynav .disabled { color: var(--text-faint); pointer-events: none; }

  /* shell (phone) */
  .shellbox { background: #060810; border: 1px solid var(--border); border-radius: 8px; padding: 6px 18px; }
  .sh-row { display: flex; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--border-soft); align-items: flex-start; }
  .sh-row:first-child { border-top: none; }
  .sh-prompt { color: var(--green); flex: none; }
  .sh-comment { color: var(--text-faint); }

  /* log */
  .log-row { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border-soft); font-size: 13px; }
  .log-row:first-child { border-top: none; }
  .log-ts { color: var(--text-faint); flex: none; font-size: 11.5px; padding-top: 2px; }
  .log-tag { color: var(--purple); flex: none; font-weight: 700; font-size: 11px; padding-top: 2px; }

  .md-row { display: flex; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--border-soft); }
  .md-row:first-child { border-top: none; }
  .md-mark { color: var(--green); flex: none; }
  .md-link { color: var(--blue); }

  .resetbar { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border-soft); }
  .reset-btn { background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 5px; padding: 7px 12px; font-size: 12px; cursor: pointer; }
  .reset-btn:hover { color: var(--text); border-color: var(--red); }

  /* ---------- animations ---------- */
  .content { animation: fadeIn .28s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .node-row { transition: background .15s ease, border-color .15s ease; }
  .btn-open { transition: transform .15s ease, background .15s ease; }
  .btn-open:hover { transform: translateY(-1px) scale(1.03); }
  .btn-open:active { transform: translateY(0) scale(.98); }
  .stat-card { transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
  .stat-card:hover { transform: translateY(-2px); border-color: var(--blue); box-shadow: 0 8px 20px -12px rgba(76,141,255,.35); }
  .stat-card.pulse { animation: pulseCard .5s ease; }
  @keyframes pulseCard { 0% { box-shadow: 0 0 0 0 rgba(76,141,255,.55); } 100% { box-shadow: 0 0 0 14px rgba(76,141,255,0); } }
  .stat-num { transition: color .2s ease; }

  .continue-card { transition: transform .18s ease; }
  .continue-card:hover { transform: translateY(-1px); }

  .track-fill { transition: width .6s cubic-bezier(.22,1,.36,1); }
  .buildbar-fill, .rail-fill { transition: width .6s cubic-bezier(.22,1,.36,1); }

  .sq { transition: transform .15s ease, background .3s ease, border-color .3s ease; }
  .sq:hover { transform: scale(1.25); }
  .sq.pop { animation: sqPop .35s ease; }
  @keyframes sqPop { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }

  .task-badge { transition: background .15s ease, border-color .15s ease, transform .15s ease; }
  .task-check:checked + .task-label .task-badge { animation: badgePop .28s ease; }
  @keyframes badgePop { 0% { transform: scale(.6); } 55% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .task-row { transition: opacity .2s ease; }

  .caret { transition: transform .15s ease, color .15s ease; }

  /* ---------- toast ---------- */
  #toastLayer {
    position: fixed; right: 18px; bottom: 18px; z-index: 100;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
    pointer-events: none; max-width: min(340px, calc(100vw - 32px));
  }
  .toast {
    pointer-events: auto; background: var(--bg-elevated); border: 1px solid var(--border);
    border-left: 3px solid var(--green); border-radius: 8px; padding: 12px 16px;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,.6); font-size: 13px; color: var(--text-bright);
    display: flex; align-items: center; gap: 10px; animation: toastIn .28s cubic-bezier(.22,1,.36,1);
  }
  .toast.out { animation: toastOut .25s ease forwards; }
  .toast .ic { font-size: 16px; }
  .toast .sub { display: block; color: var(--text-dim); font-size: 11.5px; margin-top: 2px; }
  .toast.week { border-left-color: var(--blue); }
  .toast.month { border-left-color: var(--purple); }
  .toast.streak { border-left-color: var(--orange); }
  .toast.complete { border-left-color: var(--green); background: var(--green-soft); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(24px) scale(.96); } to { opacity: 1; transform: translateX(0) scale(1); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(24px) scale(.96); } }

  /* ---------- confetti ---------- */
  #confettiLayer { position: fixed; inset: 0; pointer-events: none; z-index: 99; overflow: hidden; }
  .confetti-piece {
    position: absolute; top: -12px; width: 8px; height: 8px; opacity: .9;
    animation-name: confettiFall; animation-timing-function: cubic-bezier(.25,.46,.45,.94); animation-fill-mode: forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: .95; }
    100% { transform: translateY(100vh) rotate(540deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="window">
<div class="titlebar">
  <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
  <div class="titlebar-title">~/90-day-interview-prep — main</div>
</div>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-title">EXPLORER</div>
    <div id="tree"></div>
  </nav>

  <div class="mainpane">
    <div class="tabbar" id="tabbar"></div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <button class="menu-btn" id="menuBtn" style="margin:10px 0 0 16px;">☰ files</button>
    <div class="content" id="content"></div>
  </div>
</div>

</div>

<div id="toastLayer"></div>
<div id="confettiLayer"></div>

<script>
(function(){
  // ---------------- celebration fx ----------------
  function toast(msg, sub, type, icon){
    const layer = document.getElementById('toastLayer');
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' '+type : '');
    el.innerHTML = `<span class="ic">${icon||'✅'}</span><span>${msg}${sub?`<span class="sub">${sub}</span>`:''}</span>`;
    layer.appendChild(el);
    setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 260); }, 3400);
  }

  function confetti(big){
    const layer = document.getElementById('confettiLayer');
    const colors = ['#4C8DFF','#A78BFA','#F0A153','#3FB950','#FF5F56','#FFBD2E'];
    const count = big ? 90 : 34;
    for (let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      const left = Math.random()*100;
      const size = 6 + Math.random()*6;
      const dur = 1.6 + Math.random()*1.6;
      const delay = Math.random()*.4;
      const color = colors[Math.floor(Math.random()*colors.length)];
      const round = Math.random() > .5;
      p.style.left = left+'vw';
      p.style.width = size+'px'; p.style.height = size+'px';
      p.style.background = color;
      p.style.borderRadius = round ? '50%' : '2px';
      p.style.animationDuration = dur+'s';
      p.style.animationDelay = delay+'s';
      layer.appendChild(p);
      setTimeout(()=>p.remove(), (dur+delay)*1000 + 200);
    }
  }

  function popSquareFor(dayNum){
    const grid = document.getElementById('grid90');
    if (!grid) return;
    const idx = allDayNums.indexOf(dayNum);
    const sq = grid.children[idx];
    if (sq) { sq.classList.add('pop'); setTimeout(()=>sq.classList.remove('pop'), 400); }
  }
  function pulseStats(){
    document.querySelectorAll('.stat-card').forEach(card=>{
      card.classList.add('pulse'); setTimeout(()=>card.classList.remove('pulse'), 550);
    });
  }

  // ---------------- data ----------------
  const camps = [
    {name:"Foundations", theme:"Big-O and arrays — the ruler and the raw material every later topic uses.", days:[
      [1,"Orientation & Big-O","This is the ruler you'll use to judge every solution for the next 90 days — learn it before writing a single line.",["Time complexity of 5 snippets","Two Sum (brute force)","Two Sum (optimal)"]],
      [2,"Arrays I — traversal & in-place ops","Big-O now meets real code: watch your first loops turn into O(n) and O(n\u00b2).",["Reverse Array","Remove Duplicates from Sorted Array","Move Zeroes"]],
      [3,"Arrays II — Prefix sums","Traversal from yesterday becomes a tool for answering range questions instantly.",["Running Sum of 1d Array","Find Pivot Index","Range Sum Query - Immutable"]],
      [4,"Arrays III — Kadane's Algorithm","The running-sum idea evolves into tracking a running maximum instead.",["Maximum Subarray","Best Time to Buy and Sell Stock","Maximum Product Subarray"]],
      [5,"Arrays IV — Rotation & index tricks","Index arithmetic from Day 2 gets pushed further with cyclic shifts.",["Rotate Array","Next Permutation","Set Matrix Zeroes"]],
      [6,"Practice day","Redo this week's hardest problem from scratch, untimed, then timed.",["3 medium Array-tag problems of your choice"]],
      [7,"Rest & light review","No new problems. Re-read your notes, watch one recap video. This protects the streak.",["Review only — no coding"]]
    ]},
    {name:"Strings & Math", theme:"Strings are arrays of characters; math and bits give you the tools DP and graphs need later.", days:[
      [8,"Strings I — basics","Everything you know about arrays transfers directly — a string is just an array of characters.",["Valid Palindrome","Reverse String","Reverse Words in a String"]],
      [9,"Strings II — two pointers","The two-pointer pattern from array rotations now works on strings too.",["Valid Anagram","Longest Common Prefix","Group Anagrams"]],
      [10,"Strings III — sliding window intro","Prefix-sum windowing from Day 3 becomes a window that slides over substrings.",["Longest Substring Without Repeating Characters","Longest Repeating Character Replacement","Minimum Window Substring (attempt)"]],
      [11,"Math for DSA","GCD, primes and modular arithmetic — quiet tools that DP and graph weights need later.",["Sieve of Eratosthenes","Count Primes","GCD of Strings"]],

    } else { streak.count = 1; }
    streak.lastDate = today;
    saveStreak();
    if (MILESTONES.includes(streak.count)) {
      toast(streak.count+'-day streak!', "You've shown up "+streak.count+' days in a row. That is the whole game.', 'streak', '🔥');
      confetti(streak.count >= 30);
    }
  }

  function dayPct(num){
    const d = dayMap[num]; const total = d.subtasks.length;
    let done = 0; for (let i=0;i<total;i++) if (progress['day:'+num+':'+i]) done++;
    return Math.round(done/total*100);
  }
  function dayDoneCount(num){
    const d = dayMap[num]; let done=0; d.subtasks.forEach((_,i)=>{ if(progress['day:'+num+':'+i]) done++; });
    return done;
  }
  function isDayFull(num){ return dayPct(num) === 100; }
  function weekFull(weekIdx){ return camps[weekIdx-1].days.every(d=>isDayFull(d[0])); }
  function monthOf(weekIdx){ return months.find(m=>m.weeks.includes(weekIdx)); }
  function monthFull(monthObj){ return monthObj.weeks.every(weekFull); }
  function overallFull(){ return allDayNums.every(isDayFull); }
  const MILESTONES = [3,7,14,21,30,45,60,90];

  function totalsInRange(lo,hi){
    let total=0, done=0;
    allDayNums.filter(n=>n>=lo&&n<=hi).forEach(n=>{
      const d = dayMap[n]; total += d.subtasks.length;
      d.subtasks.forEach((_,i)=>{ if(progress['day:'+n+':'+i]) done++; });
    });
    return {total, done};
  }
  function setupDone(){ return !!progress['setup:0']; }
  function phoneDone(){ let c=0; phoneSteps.forEach((_,i)=>{ if(progress['phone:'+i]) c++; }); return c; }

  // ---------------- spaced revision ----------------
  function planEndDate(){ return dateForDay(90); }
  // shrinks the 1/3/7/15/30 gaps for days completed late in the plan, so a day's
  // full revision cycle still lands on/near the plan's end date instead of overflowing past it
  function revOffsetsFor(num){
    const base = revisionPlan.map(s=>s.offset);
    const baseStr = progress['revdate:'+num];
    if (!baseStr) return base;
    const baseDate = new Date(baseStr+'T00:00:00');
    const remaining = Math.round((planEndDate() - baseDate) / 86400000);
    if (remaining >= 30) return base;
    const room = Math.max(remaining, 5); // never compress tighter than 1/2/3/4/5 days apart
    return base.map((o,i) => Math.max(i+1, Math.round(o*room/30)));
  }
  function revDate(num, si){
    const base = progress['revdate:'+num];
    if (!base) return null;
    const d = new Date(base+'T00:00:00');
    d.setDate(d.getDate() + revOffsetsFor(num)[si]);
    return d;
  }
  function revStageDone(num, si){ return !!progress['rev:'+num+':'+si]; }
  function revCurrentStage(num){
    if (!progress['revdate:'+num]) return null;
    for (let si=0; si<revisionPlan.length; si++) if (!revStageDone(num, si)) return si;
    return null; // all 5 stages done
  }
  function revStatus(num){
    const si = revCurrentStage(num);
    if (si === null) return progress['revdate:'+num] ? 'complete' : 'locked';
    const today = new Date(); today.setHours(0,0,0,0);
    return today >= revDate(num, si) ? 'due' : 'upcoming';
  }
  function dueRevisionsToday(){
    return allDayNums.filter(n => progress['revdate:'+n] && revStatus(n) === 'due')
      .map(n => ({ num:n, si: revCurrentStage(n) }));
  }

  function firstIncomplete(){
    if (!setupDone()) return {type:'setup'};
    for (const n of allDayNums) if (!isDayFull(n)) return {type:'day', num:n};
    return null;
  }

    if (id === 'resources') return 'resources.md';
    if (id.startsWith('day-')) return 'day-'+String(id.split('-')[1]).padStart(2,'0')+'.js';
    return id;
  }
  function pathFor(id){
    if (id === 'dashboard') return ['dashboard'];
    if (id === 'setup') return ['setup.sh'];
    if (id === 'revision') return ['revision.log'];
    if (['phone','consistency','checklist','resources'].includes(id)) return ['reference', labelFor(id)];
    if (id.startsWith('day-')) {
      const num = +id.split('-')[1]; const d = dayMap[num];
      const month = months.find(m=>m.weeks.includes(d.week));
      return [month.id, 'week_'+String(d.week).padStart(2,'0'), labelFor(id)];

          else status = '<span class="st-progress">🔥 in progress</span>';

  }

  // ---------------- tree ----------------
  function treeRow({indent, icon, label, pct, active, hasChildren, open, onClick, onCaret, pinned}){
    const row = document.createElement('div');
    row.className = 'node-row indent-'+indent + (active?' active':'') + (pinned?' pinned':'');
    row.innerHTML = `
      <span class="caret ${hasChildren?(open?'open':''):'leaf'}">${hasChildren?'▶':''}</span>
      <span class="node-icon ${icon==='✓'?'icon-check':'icon-ring'}">${icon}</span>
      <span class="node-label">${label}</span>
      ${pct!==undefined?`<span class="node-pct">${pct}%</span>`:''}
    `;
    row.onclick = (e) => { if (hasChildren && (e.target.classList.contains('caret') || !onClick)) { onCaret && onCaret(); } else { onClick && onClick(); } };
    return row;
  }

  let expanded = { month_1:true, week_1:true, reference:false };

  function renderTree(){
    const tree = document.getElementById('tree'); tree.innerHTML = '';

    tree.appendChild(treeRow({ indent:0, icon:'📊', label:'dashboard', active: currentView==='dashboard', pinned:true, onClick: ()=>openView('dashboard') }));
    const setupPct = setupDone()?100:0;
    tree.appendChild(treeRow({ indent:0, icon: setupPct===100?'✓':'○', label:'setup.sh', pct:setupPct, active: currentView==='setup', onClick: ()=>openView('setup') }));
    const dueCount = dueRevisionsToday().length;
    tree.appendChild(treeRow({ indent:0, icon:'🔁', label:'revision.log'+(dueCount?` <span class="dim">(${dueCount} due)</span>`:''), active: currentView==='revision', onClick: ()=>openView('revision') }));

    months.forEach(m=>{
      const mOpen = !!expanded[m.id];
      tree.appendChild(treeRow({ indent:0, icon:'', label:`<span class="dim">${m.id}</span> ${m.label}`, hasChildren:true, open:mOpen, onCaret:()=>{ expanded[m.id]=!mOpen; renderTree(); } }));
      if (mOpen) {
        m.weeks.forEach(wk=>{
          const campName = camps[wk-1].name;
          const wkKey = 'week_'+wk;
          const wOpen = !!expanded[wkKey];
          const wdays = camps[wk-1].days.map(d=>d[0]);
          tree.appendChild(treeRow({ indent:1, icon:'', label:`<span class="dim">week_${String(wk).padStart(2,'0')}</span> ${campName}`, hasChildren:true, open:wOpen, onCaret:()=>{ expanded[wkKey]=!wOpen; renderTree(); } }));
          if (wOpen) {
            wdays.forEach(dn=>{
              const pct = dayPct(dn);
              tree.appendChild(treeRow({ indent:2, icon: pct===100?'✓':'○', label:'day-'+String(dn).padStart(2,'0')+'.js', pct, active: currentView==='day-'+dn, onClick: ()=>openView('day-'+dn) }));
            });
          }
        });
      }
    });

    const refOpen = !!expanded.reference;
    tree.appendChild(treeRow({ indent:0, icon:'', label:'reference', hasChildren:true, open:refOpen, onCaret:()=>{ expanded.reference=!refOpen; renderTree(); } }));
    if (refOpen) {
      const phonePct = Math.round(phoneDone()/phoneSteps.length*100);
      tree.appendChild(treeRow({ indent:1, icon: phonePct===100?'✓':'○', label:'phone_cleanup.sh', pct:phonePct, active: currentView==='phone', onClick: ()=>openView('phone') }));
      tree.appendChild(treeRow({ indent:1, icon:'§', label:'consistency.log', active: currentView==='consistency', onClick: ()=>openView('consistency') }));
      tree.appendChild(treeRow({ indent:1, icon:'§', label:'interview_checklist.md', active: currentView==='checklist', onClick: ()=>openView('checklist') }));
      tree.appendChild(treeRow({ indent:1, icon:'§', label:'resources.md', active: currentView==='resources', onClick: ()=>openView('resources') }));
    }
  }

  document.getElementById('menuBtn').onclick = () => document.getElementById('sidebar').classList.toggle('open');

  renderTree();
  openView('dashboard');
})();
</script>
</body>
</html>
